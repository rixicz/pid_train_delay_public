# KEEP IN MIND THAT THIS FILE NEEDS TO BE IN THE FOLDER /.github/workflows IN ORDER TO WORK

name: Delay Check

on:
  schedule:
    - cron: '30 8 * * 1-5' # runs every workday at 8:30 UTC
  workflow_dispatch: # this enables you to run this workflow manually

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Running your Python script
        env:
          NTFY_KEY: ${{ secrets.NTFY_KEY }}
        run: python main.py